<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Pi Chat — app mark (favicon copy). Two interlocking arcs forming one ring;
    see design/icon/pi-chat-mark.svg for the annotated source. Kept here at the
    path index.html already references.
  -->
  <defs>
    <mask id="under-teal" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <path d="M588.09 795.98 A294 294 0 0 1 435.91 795.98"
