[package]
name = "pi-chat"
version = "0.1.0"
description = "A small AI chat app built with SolidJS, Tailwind, Kobalte, and Tauri."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pi_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Desktop notifications for finished cron runs. Pinned to 2.4: 2.5+ requires
# tauri 2.12, and bumping tauri past 2.11.x drops the vendored
# `tauri-runtime-wry` patch (the Android blank-relaunch fix — see AGENTS.md).
tauri-plugin-notification = "=2.4.0"
# Cron schedule parsing + next-fire computation (local wall clock).
croner = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
async-openai = { version = "0.41", features = ["chat-completion"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread", "process", "fs", "sync", "net", "io-util"] }
tokio-stream = "0.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# The live clock note states the device's local UTC offset. chrono resolves the
# OS local timezone (DST-aware) and is already in the tree transitively (via
# serde_with), so this only promotes it to a direct dependency.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Android-only: rustls-platform-verifier needs a JNI env + Context to reach the
# OS trust store (see crate::android::init_rustls). `jni` 0.22 matches the
# version rustls-platform-verifier 0.7 uses so our export can feed it the Env
# directly.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"


# ---------------------------------------------------------------------------
# Vendored crate patch: `tauri-runtime-wry` 2.11.4 is copied under `vendor/` so
# we can apply upstream PR tauri-apps/tauri#15678. On mobile, `Event::Resumed`
# only dispatched per-window events, so the app-level `RunEvent::Resumed`
# callback never fired when no window was alive — which is exactly the state
# after Android swipes the app away while `prevent_exit()` + the keep-alive
# foreground service hold the process open. Without it, relaunch leaves a blank
# window (tauri#15671). The patch makes the resume reach `RunEvent::Resumed` in
# `src/lib.rs`. Drop this once a released dependency includes the fix.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
